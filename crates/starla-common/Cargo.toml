[package]
name = "starla-common"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared types and utilities for the Starla RIPE Atlas software probe"
repository.workspace = true
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
libc = "0.2"

[target.'cfg(unix)'.dependencies]
# A SIGTERM writes out the queued log lines before the process dies of it.
# Already in Cargo.lock: it is what tokio's signal handling registers with.
signal-hook-registry = "1.4"

[features]
default = []
json = ["tracing-subscriber/json"]
