[package]
name = "starla-measurements"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Network measurement implementations for the Starla RIPE Atlas software probe"
repository.workspace = true
readme = "README.md"

[dependencies]
starla-common = { workspace = true }
starla-network = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hickory-resolver = { workspace = true }
hickory-proto = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
x509-parser = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
socket2 = { workspace = true }
pnet_packet = { workspace = true }
webpki-roots = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# recvmsg() control messages and raw-socket options: evtdig --ttl
# (IP_RECVTTL / IPV6_RECVHOPLIMIT) and traceroute's raw sockets (IPv6 hop
# limit and traffic class, CLOCK_MONOTONIC). Every use is cfg(unix)/cfg(linux).
libc = { workspace = true }

[features]
default = ["scamper"]
# The scamper backend for ping and traceroute (PingBackend::Scamper,
# TracerouteBackend::Scamper). On Linux it links rscamper, and through it
# CAIDA's libscamperfile/libscamperctrl as static libraries; elsewhere it
# adds nothing. Without it the crate builds from Rust and crates.io alone
# on every platform, and selecting the scamper backend is a runtime error,
# as it always is off Linux.
scamper = ["dep:rscamper"]

# Scamper-backed measurement backends. The rscamper crate FFI-links against
# CAIDA's libscamperfile/libscamperctrl, which are only built on Linux —
# the source modules are gated on `cfg(all(target_os = "linux", feature =
# "scamper"))` to match.
[target.'cfg(target_os = "linux")'.dependencies]
rscamper = { version = "0.2", optional = true }
